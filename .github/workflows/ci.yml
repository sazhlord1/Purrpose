# Typecheck + tests on every push to main (server tests run against a throwaway Postgres).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: purrpose
          POSTGRES_PASSWORD: purrpose
          POSTGRES_DB: purrpose
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U purrpose"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://purrpose:purrpose@localhost:5433/purrpose?schema=public
      DATABASE_URL_TEST: postgresql://purrpose:purrpose@localhost:5433/purrpose?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @purrpose/shared build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Database schema
        run: pnpm --filter @purrpose/server exec prisma migrate deploy
      - name: Tests
        run: pnpm -r --workspace-concurrency=1 test -- --reporter=default --reporter=github-actions
      - name: Lint
        continue-on-error: true
        run: pnpm lint
