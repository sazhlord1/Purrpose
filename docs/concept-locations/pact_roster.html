  <title>Purrpose — Complete 8-Cat Pact Sealed High-Five Roster</title>
  <style>
    :root {
      --bg: #F4EFE6;
      --card-bg: #FAF6EE;
      --ink: #26201D;
      --border: #26201D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 48px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      max-width: 840px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p.sub {
      margin: 0;
      color: #6C5E53;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 1200px;
      width: 100%;
    }
    @media (max-width: 1080px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
    }
    .pact-card {
      background: #FAF6EE;
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 8px 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .pact-preview {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-label {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }
  </style>
</head>
