<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purrpose — Rebuilt 6-Location Scene Roster</title>
  <style>
    :root {
      --bg: #F4EFE6;
      --card-bg: #FAF6EE;
      --ink: #26201D;
      --border: #26201D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px 64px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      max-width: 840px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p.sub {
      margin: 0;
      color: #6C5E53;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1140px;
      width: 100%;
    }
    @media (max-width: 960px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    .scene-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 5px 5px 0 var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .scene-preview {
      width: 100%;
      height: 250px;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .num {
      background: var(--ink);
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
  </style>
</head>
